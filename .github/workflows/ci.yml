name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR への連続 push では古い実行を打ち切る(main への push は打ち切らない)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # バージョンは package.json の packageManager フィールドから解決される

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # dist はコミットして配布する(git 依存の利用側にビルドさせない)。
      # src を変えたら pnpm compile して dist も一緒にコミットすること。
      - name: Check dist freshness
        run: pnpm compile && git diff --exit-code -- dist
